spring.application.name=study-finder
server.error.whitelabel.enabled=false
app.database-url=${DATABASE_URL:jdbc:sqlite:study-finder.db}
app.jwt-secret=${JWT_SECRET:change-this-development-secret-to-a-random-32-character-value}
app.jwt-issuer=${JWT_ISSUER:study-finder-api}
app.jwt-audience=${JWT_AUDIENCE:study-finder-client}
app.cors-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
